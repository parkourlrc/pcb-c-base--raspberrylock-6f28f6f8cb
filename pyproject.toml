[project]
name = "raspberrylock"
version = "2.0.0"
description = "Door-lock software for the Raspberry Pi using GPIOs"
authors = [
    {name = "Uwe Kamper", email="uk@c-base.org"},
]
readme = "README.md"
requires-python = ">= 3.9"
dependencies = [
    "gpiozero>=2.0.1",
    "pytest>=8.1.1",
    "click>=8.1.7",
]

[tool.poetry]
name = "raspberrylock"
version = "0.1.0"
description = "Door-lock software for the Raspberry Pi using GPIOs"
authors = ["Uwe Kamper <uk@c-base.org>"]

[tool.poetry.dependencies]
python = "^3.9"
gpiozero = "^2.0.1"
pytest = "^8.1.1"
click = "^8.1.7"
starlette = "^0.37.2"
uvicorn = "^0.29.0"
pigpio = "^1.78"
ldap3 = "^2.9.1"
tinydb = "^4.8.0"

[tool.poetry.scripts]
raspberrylock-cli = "raspberrylock.main:cli_main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"